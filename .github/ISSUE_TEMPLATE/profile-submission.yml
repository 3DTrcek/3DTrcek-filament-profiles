name: Submit a filament profile
description: Share your slicer profile for a 3DTrcek filament – no Git needed.
title: "[Profile] <Material> on <Printer> (<Slicer>)"
labels: ["profile-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! It takes about two minutes, and **you don't need to rename anything** – we do that for you.

        **1. Export your filament preset**

        <details><summary><b>Bambu Studio · OrcaSlicer · Creality Print · QIDI Studio · ElegooSlicer · Anycubic Slicer Next</b></summary>

        1. Select your 3DTrcek filament preset in the filament list.
        2. **File → Export → Export Configs…**
        3. Tick **only your filament preset** and click **Confirm**.
        4. Save the `.json` file (or the `.zip` the slicer creates – both are fine).
        </details>

        <details><summary><b>PrusaSlicer · SuperSlicer</b></summary>

        1. Select your filament preset in the **Filament** tab.
        2. **File → Export → Export Config…**
        3. Save the `.ini` file.
        </details>

        <details><summary><b>UltiMaker Cura</b></summary>

        1. **Preferences → Configure Cura → Profiles**
        2. Select your profile and click **Export**.
        3. Save the `.curaprofile` file.
        </details>

        <details><summary><b>Other slicers</b></summary>

        Export the material/filament profile however your slicer allows, put it in a `.zip` and attach it.
        </details>

        **2. Fill in the form and drag the file into the box at the bottom.**

  - type: dropdown
    id: slicer
    attributes:
      label: Slicer
      options:
        - Bambu Studio
        - OrcaSlicer
        - PrusaSlicer
        - UltiMaker Cura
        - Creality Print
        - QIDI Studio
        - ElegooSlicer
        - Anycubic Slicer Next
        - SuperSlicer
        - FlashPrint
        - Simplify3D
        - ideaMaker
        - Other (write in notes)
    validations:
      required: true

  - type: input
    id: slicer_version
    attributes:
      label: Slicer version
      placeholder: "2.3.1"

  - type: dropdown
    id: brand
    attributes:
      label: Printer brand
      options:
        - Bambu Lab
        - Prusa
        - Creality
        - Elegoo
        - Anycubic
        - QIDI
        - Flashforge
        - Sovol
        - Artillery
        - Anker / AnkerMake
        - Snapmaker
        - UltiMaker
        - Raise3D
        - Voron / RatRig / DIY
        - Other (write model below)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Printer model
      description: Exact model, as printed on the printer
      placeholder: "MK4S / Ender-3 V3 / K1 Max / Neptune 4 Pro"
    validations:
      required: true

  - type: dropdown
    id: family
    attributes:
      label: Material type
      options:
        - PLA
        - PETG
        - PCTG
        - ASA
        - ABS
        - TPU
        - PA (Nylon)
        - PC
        - PP
        - Other
    validations:
      required: true

  - type: input
    id: product
    attributes:
      label: 3DTrcek product name
      description: As written on the spool or in the shop – anything goes, new materials included.
      placeholder: "PETG Mat, PLA Mat HS, ASA-CF, TPU 95A…"
    validations:
      required: true

  - type: dropdown
    id: nozzle
    attributes:
      label: Nozzle diameter
      options:
        - "0.4 mm"
        - "0.2 mm"
        - "0.6 mm"
        - "0.8 mm"
        - "Other (write in notes)"
    validations:
      required: true

  - type: checkboxes
    id: nozzle_type
    attributes:
      label: Nozzle type
      options:
        - label: High-flow nozzle
        - label: Hardened steel / abrasive-ready

  - type: textarea
    id: settings
    attributes:
      label: Key settings
      description: Whatever you tuned
      value: |
        Nozzle temp:
        Bed temp:
        Max volumetric speed:
        Flow ratio:
        Pressure advance / K:
        Cooling fan:
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Test results and notes
      description: What did you print, how did it come out? Printer mods (enclosure, hotend…)? Photos are very welcome.
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: Profile file
      description: Drag and drop your exported profile here. If GitHub refuses the file type, zip it first.
    validations:
      required: true

  - type: input
    id: credit
    attributes:
      label: Credit name
      description: Name or nickname for the file name (leave empty to use your GitHub username)
      placeholder: "janez"

  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I made this profile and agree to share it under CC BY 4.0.
          required: true
