name: Validate profiles

on:
  pull_request:
    paths: ["profiles/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check changed profiles
        env:
          ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          git diff --name-only --diff-filter=AMR origin/${{ github.base_ref }}...HEAD -- profiles > changed.txt
          cat changed.txt
          [ -s changed.txt ] || exit 0
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) FLAG="" ;;
            *) FLAG="--external" ;;
          esac
          xargs -a changed.txt python scripts/profiles.py validate $FLAG
