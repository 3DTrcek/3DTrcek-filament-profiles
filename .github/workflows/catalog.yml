name: Update catalog

on:
  push:
    branches: [main]
    paths: ["profiles/**", "scripts/profiles.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate everything
        run: python scripts/profiles.py validate

      - name: Rebuild catalog
        run: python scripts/profiles.py catalog

      - name: Commit if changed
        run: |
          git add CATALOG.md catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git config user.name "3DTrcek"
            git config user.email "info@3dtrcek.com"
            git commit -m "Update profile catalog"
            git push
          fi
